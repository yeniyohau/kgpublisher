      /* Lapisan tempat seluruh bola bergerak */
.billiard-rain {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 1;
}

/* Pengaturan dasar setiap bola */
.billiard-ball {
  --size: 48px;

  position: absolute;
  top: -100px;

  width: var(--size);
  height: var(--size);

  background-image: url("https://imgstore.io/images/2026/08/02/billiard-sprite-1-15.png");
  background-repeat: no-repeat;

  /*
    Sprite terdiri dari:
    5 kolom
    3 baris
  */
  background-size:
    calc(var(--size) * 5)
    calc(var(--size) * 3);

  filter: drop-shadow(0 5px 7px rgba(0, 0, 0, 0.55));

  animation-name: billiardFall;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}

/* Bola nomor 1 */
.ball-1 {
  left: 5%;
  background-position: 0 0;
  animation-duration: 8s;
  animation-delay: 0s;
}

/* Bola nomor 2 */
.ball-2 {
  left: 15%;
  background-position: calc(var(--size) * -1) 0;
  animation-duration: 9s;
  animation-delay: 1s;
}

/* Bola nomor 3 */
.ball-3 {
  left: 25%;
  background-position: calc(var(--size) * -2) 0;
  animation-duration: 10s;
  animation-delay: 2s;
}

/* Bola nomor 4 */
.ball-4 {
  left: 35%;
  background-position: calc(var(--size) * -3) 0;
  animation-duration: 8.5s;
  animation-delay: 3s;
}

/* Bola nomor 5 */
.ball-5 {
  left: 45%;
  background-position: calc(var(--size) * -4) 0;
  animation-duration: 9.5s;
  animation-delay: 4s;
}

/* Bola nomor 6 */
.ball-6 {
  left: 55%;
  background-position:
    0
    calc(var(--size) * -1);
  animation-duration: 8s;
  animation-delay: 0.8s;
}

/* Bola nomor 7 */
.ball-7 {
  left: 65%;
  background-position:
    calc(var(--size) * -1)
    calc(var(--size) * -1);
  animation-duration: 10s;
  animation-delay: 1.8s;
}

/* Bola nomor 8 */
.ball-8 {
  left: 75%;
  background-position:
    calc(var(--size) * -2)
    calc(var(--size) * -1);
  animation-duration: 9s;
  animation-delay: 2.8s;
}

/* Bola nomor 9 */
.ball-9 {
  left: 85%;
  background-position:
    calc(var(--size) * -3)
    calc(var(--size) * -1);
  animation-duration: 8.5s;
  animation-delay: 3.8s;
}

/* Bola nomor 10 */
.ball-10 {
  left: 92%;
  background-position:
    calc(var(--size) * -4)
    calc(var(--size) * -1);
  animation-duration: 10s;
  animation-delay: 4.8s;
}

/* Bola nomor 11 */
.ball-11 {
  left: 10%;
  background-position:
    0
    calc(var(--size) * -2);
  animation-duration: 9.5s;
  animation-delay: 5.5s;
}

/* Bola nomor 12 */
.ball-12 {
  left: 30%;
  background-position:
    calc(var(--size) * -1)
    calc(var(--size) * -2);
  animation-duration: 8.5s;
  animation-delay: 6.2s;
}

/* Bola nomor 13 */
.ball-13 {
  left: 50%;
  background-position:
    calc(var(--size) * -2)
    calc(var(--size) * -2);
  animation-duration: 10s;
  animation-delay: 6.9s;
}

/* Bola nomor 14 */
.ball-14 {
  left: 70%;
  background-position:
    calc(var(--size) * -3)
    calc(var(--size) * -2);
  animation-duration: 9s;
  animation-delay: 7.6s;
}

/* Bola nomor 15 */
.ball-15 {
  left: 88%;
  background-position:
    calc(var(--size) * -4)
    calc(var(--size) * -2);
  animation-duration: 8s;
  animation-delay: 8.3s;
}

/* Animasi bola jatuh */
@keyframes billiardFall {
  0% {
    transform:
      translate3d(0, -120px, 0)
      rotate(0deg)
      scale(0.65);

    opacity: 0;
  }

  8% {
    opacity: 1;
  }

  35% {
    transform:
      translate3d(20px, 38vh, 0)
      rotate(300deg)
      scale(0.8);
  }

  70% {
    transform:
      translate3d(-18px, 78vh, 0)
      rotate(640deg)
      scale(0.95);
  }

  100% {
    transform:
      translate3d(12px, 118vh, 0)
      rotate(960deg)
      scale(1.05);

    opacity: 0;
  }
}
